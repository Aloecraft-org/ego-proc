[package]
name = "ego_proc"
version = "0.1.2"
edition = "2024"

[lib]
name = "ego_proc"
path = "src/lib.rs"

[dependencies]
ego_platform = { git = "https://github.com/Aloecraft-org/ego-platform" }
futures = "0.3"
log = "0.4"
anyhow = "1.0.101"
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
async-trait = "0.1"
uuid = {version = "1.20.0",features = ["v4", "js", "v7"]}

serde = { version = "1.0",  features = ["derive","std"]  }
serde_json = "1.0"
prost = "0.14"
thiserror = "2"


[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3.12"

[build-dependencies]
prost-build = "0.13"